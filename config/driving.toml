# Hand-kept recompiler config for Driving.xbe (the driving levels), the file the build reads. config/driving_game.toml
# is xbe_symbols output and every scan rewrites it, so nothing is edited there: it is included here, and everything
# added by hand goes below. Sign with config/nightfire.toml (see there).
includes = ["driving_game.toml"]

# The names default.xbe's hand config proves are signed into sdk/xdk/4831 and found here by the scan; every name both
# xbes have was compared by its call chain (callees 5 deep) and agrees (0.97 or more).
[symbols]
DirectSoundCreateBuffer = 0x17C2A0  # (desc, ppBuffer) ret 8 (0x17C2F4): 0x17BFE8 allocates 0x24 bytes, constructs them
                                    # (0x17B915) and returns the object + 0x1C, the buffer interface the C API thunks
                                    # take back by 0x1C; default.xbe does not link it (it calls IDirectSound_CreateSoundBuffer)
IDirectSoundBuffer_SetFilter = 0x17B5E0  # -> 0x17B4B3 -> 0x17B05C: forwards the argument to the voice at +0xC (0x17E53F),
                                    # PGR2's SetFilter leaf 0x1EBE48 instruction for instruction (its voice call 0x1F2B45
                                    # 0.83 alike); between SetVolume 0x17B5C4 and SetMixBins 0x17B5FC as in 5659's order.
                                    # Driving.xbe's DSOUND links it, default.xbe's does not; the game 0x1429F0 calls it
D3DDevice_SetPixelShaderConstant = 0x16B160  # ret 0xC (0x16B424); its opening reads the current pixel shader's definition
                                    # ([[pDevice]+0x370]+8, 0x16B16C) as PGR2's 0x1C27C0 does, instruction for instruction;
                                    # the game 0xF44AF calls it (default.xbe does not link it)
D3DDevice_Reset         = 0x166230  # PGR2's 0x1C38D0 at 0.96 (instructions, numbers masked), ret 4: its frame buffer
                                    # teardown 0x16D180 released the host's own back and depth buffers, and the game's
                                    # last release of the depth buffer at a mission's end (0xE8692) freed a host header
                                    # with HeapFree (heap corrupt: the crash leaving Paris); the game calls it at 0xE6D88
D3DDevice_SetPalette    = 0x1669E0  # (stage, palette) ret 8: stores it in the device's palette slot [+0xB48 + stage * 4]
                                    # with an internal reference and pushes 0x41B20 + stage * 0x40 (0x166A56) itself, as
                                    # EoN's QFE 4 one; unnamed, the host never saw a palette: the P8 menu panels were noise
D3D_BlockOnNonSurfaceResource = 0x16CE90  # (resource) ret 4: a resource's lock waits on [+8] (or, internally
                                    # referenced, the device's [+0x30]) through 0x16CAE0, beside BlockOnResource 0x16CE10;
                                    # the vertex buffer lock 0x16B4C0 calls it (0x16B4F9) without NOOVERWRITE. Unnamed, it
                                    # never waited for the render thread: the loading screen's ring of three buffers a tile
                                    # (0xF6E90) was rewritten before its draws ran (default.xbe does not link it)
IDirectSound_SetI3DL2Listener = 0x17BE1B  # this - 8, 2 arguments (ret 0xC) -> 0x17BAF4: copies a DSI3DL2LISTENER (Room,
                                    # RoomHF, RolloffFactor, DecayTime ... from 0x17BB3C) into the effect settings,
                                    # DSERR 0x88780032 without an effects image (0x17BB31); the game 0x140A80 calls it

[data]
XPP_GamepadType         = 0x183AEC  # XDEVICE_TYPE_GAMEPAD: the game passes it to XInputOpen 0x1848AD (0x1084FE, 0x108712);
                                    # 0x2C into XPP, as default.xbe's 0x15722C

[functions]
0x81D10 = "VehicleState_81D10"  # a state's update (+0x14 of the 0x18-byte entries at [0x1EC368], set by 0x78770 at 0x79405),
                                # called through the table at 0x8783F: no decode reached it (Harry's third mission trapped)
0x183BF4 = "XPP_DeviceTypeInit_183BF4"  # the first two XPP device types' init (descriptors 0x183B98, 0x183BB0 at +4), called
                                        # through the table 0x183AD4..0x183AE0 by XInitDevices 0x183DFD; no decode reached it
