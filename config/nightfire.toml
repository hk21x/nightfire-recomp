[data]
XPP_GamepadType         = 0x15722C  # XDEVICE_TYPE_GAMEPAD: the game passes it to XInputOpen (0xE7652) and XGetDevices 0x158137
                                    # (0xE7621), which returns +0, clears +4 and copies +0 to +8 (XPP_Current/Changed/Previous)
DSound_StreamVtable2    = 0x162640  # the stream constructor 0x114265 stores it at this + 4 (0x114277), as PGR2's 0x1EDE72

[functions]
0x114265 = "CDirectSoundStream_Constructor"  # stores both stream vtables (0x114277 +4, 0x11427E +0); --sign anchors them on it
0x157334 = "XPP_DeviceTypeInit_157334"  # the init of the first two XPP device types (descriptors 0x1572D8, 0x1572F0 at +4),
                                        # called through the table 0x157214..0x157220 by 0x15757B; no decode reached it
